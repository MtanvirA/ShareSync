<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShareSync - Create your investment portfolio account" />
    <title>ShareSync | Register</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <style>
      .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--color-background);
      }
      .auth-card {
        width: 100%;
        max-width: 460px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        padding: 36px 32px;
        box-shadow: var(--shadow-card);
      }
      .auth-header {
        text-align: center;
        margin-bottom: 28px;
      }
      .auth-header .brand {
        display: inline-flex;
        margin-bottom: 16px;
      }
      .auth-title {
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 700;
        color: var(--color-primary);
        margin-bottom: 6px;
      }
      .auth-subtitle {
        color: var(--color-text-secondary);
        font-size: 13px;
        margin-bottom: 0;
      }
      .auth-alert {
        display: none;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .auth-alert.show {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .auth-alert-danger {
        background: var(--color-negative-soft);
        color: var(--color-negative);
        border: 1px solid rgba(192, 57, 43, 0.2);
      }
      .auth-alert-success {
        background: var(--color-positive-soft);
        color: var(--color-positive);
        border: 1px solid rgba(22, 122, 74, 0.2);
      }
      .auth-footer {
        text-align: center;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--color-border);
        color: var(--color-text-secondary);
        font-size: 13px;
      }
      .auth-footer a {
        color: var(--color-accent);
        font-weight: 600;
        text-decoration: none;
      }
      .auth-footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="brand text-decoration-none">
            <span class="brand-mark">S</span>
            <span class="brand-name">Share<span>Sync</span></span>
          </a>
          <h1 class="auth-title">Create your account</h1>
          <p class="auth-subtitle">Start tracking your portfolios, dividends & analytics</p>
        </div>

        <div id="authAlert" class="auth-alert auth-alert-danger" role="alert">
          <i class="bi bi-exclamation-circle-fill flex-shrink-0 mt-1"></i>
          <div id="authAlertText"></div>
        </div>

        <form id="registerForm" novalidate>
          <div class="form-field mb-3">
            <label for="registerName">Full Name</label>
            <input
              type="text"
              id="registerName"
              placeholder="e.g. Tanvir Ahmed"
              required
              minlength="2"
              maxlength="100"
              autocomplete="name"
            />
            <span class="field-error" id="registerNameError"></span>
          </div>

          <div class="form-field mb-3">
            <label for="registerEmail">Email address</label>
            <input
              type="email"
              id="registerEmail"
              placeholder="name@example.com"
              required
              maxlength="150"
              autocomplete="email"
            />
            <span class="field-error" id="registerEmailError"></span>
          </div>

          <div class="form-field mb-3">
            <label for="registerPassword">Password <span>(min 6 characters)</span></label>
            <input
              type="password"
              id="registerPassword"
              placeholder="Create a strong password"
              required
              minlength="6"
              maxlength="100"
              autocomplete="new-password"
            />
            <span class="field-error" id="registerPasswordError"></span>
          </div>

          <div class="form-field mb-4">
            <label for="registerConfirmPassword">Confirm Password</label>
            <input
              type="password"
              id="registerConfirmPassword"
              placeholder="Re-enter your password"
              required
              autocomplete="new-password"
            />
            <span class="field-error" id="registerConfirmPasswordError"></span>
          </div>

          <button type="submit" class="primary-button w-100 py-2 justify-content-center" id="registerBtn">
            <i class="bi bi-person-check"></i>
            <span>Create Account</span>
          </button>
        </form>

        <div class="auth-footer">
          Already have an account?
          <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- ShareSync JavaScript -->
    <script src="js/app.js"></script>
  </body>
</html>
